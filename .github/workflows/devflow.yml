# devflow 自己的 CI：证明"CI 能拿到 kit 并跑通全部门禁"。
# 这是产品自证的一环 —— 连自己都不跑 CI，就无法要求别人跑。
name: devflow

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  # 必过：自检 + 五套端到端
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node 版本
        run: node --version
      - name: 环境（零依赖，无需 npm install）
        run: |
          node --version
          test ! -d node_modules || { echo "本产品要求零依赖，不应存在 node_modules"; exit 1; }
      - name: 单元测试（纯函数层，node:test）
        run: npm test
      - name: 自检
        run: node scripts/selfcheck.mjs
      - name: 演示素材可重新生成（真跑 → 采集 → 渲染）
        run: |
          # Pillow 只用于"把输出画成 GIF"，devflow 本体仍是零依赖
          python3 -m pip install -q pillow
          python3 tools/demo/capture_flow.py --out /tmp/demo.json
          python3 tools/make_flow_gif.py --data /tmp/demo.json --out /tmp/demo.gif
          test -s /tmp/demo.gif
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/demo.json'))
          assert len(d['steps']) >= 5, d
          assert any(s['gates'] for s in d['steps']), "演示里没有任何门禁结论"
          assert os.path.getsize('/tmp/demo.gif') > 100_000
          print("演示素材 OK：", len(d['steps']), "步")
          PY

      - name: 五套端到端（含人的闭环）
        run: bash examples/verify-all.sh
      - name: 提交信息规范（校验 HEAD）
        run: node tools/validate-commit-msg.mjs --text "$(git log -1 --format=%B)"

  # 报告性质：kit 对自身校验通过，且不依赖网络
  self-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node 版本
        run: node --version
      - name: 模板与正典一致性
        run: |
          node scripts/selfcheck.mjs 2>&1 | tail -3
          echo "---- 正典 ----"
          ls -1 spec/
          echo "---- 模板 ----"
          ls -1 templates/
